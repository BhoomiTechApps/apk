name: Build FieldCam APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write   # to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners ship with the Android SDK; just accept licences and add Android 36.
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" || echo "::warning::sdkmanager install failed; Gradle will try to fetch what it needs"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (tower positioning + import)
        run: npm test

      - name: Sync web assets into the Android project
        run: npm run sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: FieldCam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as "latest-debug" release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FieldCam-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug FieldCam-debug.apk \
            --prerelease --title "FieldCam — latest debug build" \
            --notes "Built from ${GITHUB_SHA::7}. Download FieldCam-debug.apk on your Android phone and install it."
